name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel old runs when a new commit is pushed to the same branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Biome replaces ESLint + Prettier. This is a real gate now — it no
      # longer runs with continue-on-error, so a lint error fails the build.
      # The formatter is configured but disabled in biome.json, so `biome ci`
      # checks lint rules only.
      - name: Biome
        run: npm run ci

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: typecheck

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-ansimax
          fail_ci_if_error: false

  build-check:
    name: Build & Bundle Verification
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(du -sh dist/ | cut -f1)
          echo "Bundle size: $SIZE"
          echo "### 📦 Bundle Size: $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Verify dist exports
        run: |
          node -e "
            const pkg = require('./package.json');
            const fs = require('fs');
            const checks = [];
            if (pkg.main) checks.push(['main', pkg.main]);
            if (pkg.module) checks.push(['module', pkg.module]);
            if (pkg.types) checks.push(['types', pkg.types]);
            let ok = true;
            for (const [k, p] of checks) {
              if (!fs.existsSync(p)) {
                console.error('✗ Missing ' + k + ': ' + p);
                ok = false;
              } else {
                console.log('✓ ' + k + ': ' + p);
              }
            }
            if (!ok) process.exit(1);
          "

      - name: Verify package can be packed
        run: npm pack --dry-run

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Informational on purpose. bench/baseline.json is recorded on a
      # developer machine, and absolute timings differ enough between that and
      # a shared CI runner that `--check` would fail on noise rather than on
      # real regressions. The numbers land in the job summary and as an
      # artifact so a change in shape is visible; run `npm run bench -- --check`
      # locally against your own baseline to gate a specific optimization.
      - name: Run benchmarks
        run: |
          npm run bench | tee bench-result.txt
          {
            echo '### Benchmarks'
            echo '```'
            cat bench-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark JSON
        run: npm run bench -- --json > bench-result.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            bench-result.txt
            bench-result.json
          retention-days: 30
